[project]
name = "por-que-anda-lento"
version = "0.1.0"
description = "Colector de datos para diagnosticar por qué una PC Windows anda lenta"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psutil>=6",
    "pywin32>=308",
]

[project.scripts]
collect = "lento.cli:collect_main"
setup = "lento.cli:setup_main"
record-fixture = "lento.cli:record_main"

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lento"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: ejecuta el Colector real en esta PC (requiere admin); no corre por defecto",
]
addopts = "-m 'not smoke'"

[tool.mypy]
python_version = "3.12"
files = ["src/lento", "tests"]
ignore_missing_imports = true
check_untyped_defs = true
